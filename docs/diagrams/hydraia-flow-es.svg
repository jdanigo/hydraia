<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Un comando de Hydraia corre todo el pipeline: diseño interactivo, un gate de plan congelado, y luego construcción, revisión y verificación autónomas.">
  <defs>
    <linearGradient id="halfL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="halfR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0.20"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="916" height="296" rx="16" fill="#0d1117" stroke="#30363d"/>

  <rect x="16" y="86" width="352" height="128" rx="12" fill="url(#halfL)"/>
  <rect x="392" y="86" width="512" height="128" rx="12" fill="url(#halfR)"/>

  <text x="460" y="42" text-anchor="middle" fill="#e6edf3" font-size="21" font-weight="700">Un comando corre todo el pipeline</text>
  <text x="460" y="66" text-anchor="middle" fill="#8b949e" font-size="13">/hydraia:feature — tú te quedas en el diseño; él construye, revisa y verifica solo</text>

  <line x1="110" y1="150" x2="830" y2="150" stroke="#30363d" stroke-width="2"/>

  <line x1="380" y1="104" x2="380" y2="196" stroke="#f0883e" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="380" y="210" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="600">plan congelado</text>

  <g>
    <rect x="45" y="126" width="130" height="48" rx="10" fill="#161b22" stroke="#a371f7">
      <animate attributeName="stroke-width" dur="4s" repeatCount="indefinite" keyTimes="0;0.05;0.1;0.18;1" values="1;1;3;1;1"/>
    </rect>
    <text x="110" y="150" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Diseño</text>
    <text x="110" y="166" text-anchor="middle" fill="#8b949e" font-size="10">spec + threat model</text>
  </g>
  <g>
    <rect x="225" y="126" width="130" height="48" rx="10" fill="#161b22" stroke="#a371f7">
      <animate attributeName="stroke-width" dur="4s" repeatCount="indefinite" keyTimes="0;0.20;0.25;0.33;1" values="1;1;3;1;1"/>
    </rect>
    <text x="290" y="150" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Plan</text>
    <text x="290" y="166" text-anchor="middle" fill="#8b949e" font-size="10">+ auto-revisión</text>
  </g>
  <g>
    <rect x="405" y="126" width="130" height="48" rx="10" fill="#161b22" stroke="#3fb950">
      <animate attributeName="stroke-width" dur="4s" repeatCount="indefinite" keyTimes="0;0.45;0.5;0.58;1" values="1;1;3;1;1"/>
    </rect>
    <text x="470" y="150" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Ejecuta</text>
    <text x="470" y="166" text-anchor="middle" fill="#8b949e" font-size="10">sub-agente por tarea</text>
  </g>
  <g>
    <rect x="585" y="126" width="130" height="48" rx="10" fill="#161b22" stroke="#3fb950">
      <animate attributeName="stroke-width" dur="4s" repeatCount="indefinite" keyTimes="0;0.68;0.73;0.81;1" values="1;1;3;1;1"/>
    </rect>
    <text x="650" y="150" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Revisa</text>
    <text x="650" y="166" text-anchor="middle" fill="#8b949e" font-size="10">2× + gate seguridad</text>
  </g>
  <g>
    <rect x="765" y="126" width="130" height="48" rx="10" fill="#161b22" stroke="#3fb950">
      <animate attributeName="stroke-width" dur="4s" repeatCount="indefinite" keyTimes="0;0.88;0.93;1;1" values="1;1;3;1;1"/>
    </rect>
    <text x="830" y="150" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Verifica</text>
    <text x="830" y="166" text-anchor="middle" fill="#8b949e" font-size="10">tests + scan</text>
  </g>

  <circle r="9" fill="url(#spark)">
    <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.02;0.96;1" calcMode="linear" path="M110,150 H830"/>
  </circle>

  <text x="192" y="252" text-anchor="middle" fill="#a371f7" font-size="12" font-weight="600">Diseño interactivo · Opus 4.8</text>
  <text x="648" y="252" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="600">Construcción autónoma · Sonnet 5</text>
</svg>
